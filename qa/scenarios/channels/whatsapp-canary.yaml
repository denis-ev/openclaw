title: WhatsApp DM canary
scenario:
  id: whatsapp-canary
  surface: channels
  coverage:
    primary:
      - whatsapp.outbound-text-sends
  execution:
    kind: flow
    channel: whatsapp
    timeoutMs: 60000
    retryCount: 1
    suiteIsolation: isolated
flow:
  module: ./live-transports/whatsapp/scenario-runtime.js
  requiredImplementationCapabilities: [adapter-prepared-flow-context]
  call: runWhatsAppScenario
  args:
    - { expr: whatsappScenarioContext }
    - { moduleExport: whatsappQaCanaryScenario }
