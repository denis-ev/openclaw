title: Slack canary echo
scenario:
  id: slack-canary
  surface: channels
  coverage:
    primary:
      - slack.socket
  execution:
    kind: flow
    channel: slack
    timeoutMs: 45000
    retryCount: 1
    suiteIsolation: isolated
flow:
  module: ./live-transports/slack/scenario-runtime.js
  requiredImplementationCapabilities: [adapter-prepared-flow-context]
  call: runSlackScenario
  args:
    - { expr: slackScenarioContext }
    - { moduleExport: slackQaCanaryScenario }
