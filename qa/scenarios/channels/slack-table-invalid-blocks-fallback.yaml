title: Slack invalid_blocks recovery stores its complete fallback
scenario:
  id: slack-table-invalid-blocks-fallback
  surface: channels
  coverage:
    primary:
      - slack.media-and-rich-content
  execution:
    kind: flow
    channel: slack
    timeoutMs: 45000
    retryCount: 1
    suiteIsolation: isolated
flow:
  module: ./live-transports/slack/scenario-runtime.js
  requiredImplementationCapabilities: [adapter-prepared-flow-context]
  call: runSlackScenario
  args:
    - { expr: slackScenarioContext }
    - { moduleExport: slackQaTableInvalidBlocksFallbackScenario }
